    <div class="eyebrow">Artist Statement</div>
    <h1>藝術家自述</h1>
    <p class="about-bio-small">2006年出生新北市三重區<br>臺北市立百齡高級中學附屬國中部 美術班<br>國立師範大學附屬高級中學 美術班<br>國立臺北藝術大學 新媒體藝術學系</p>
  </section>

  <section class="dark-panel dark-two-col dark-fade-in delay-1">
    <p class="dark-text">
      創作關注日常物件如何在不同情境中產生新的象徵與行動能力。作品經常從地方信仰、城市空間與媒體技術出發，將錄像、裝置、行為紀錄組合成可被重新閱讀的現場。
    </p>
    <p class="dark-text">
      對我而言，媒介不是單純的工具，而是一種改變觀看方式的結構。透過影像、感測器、行為與機械裝置，作品試圖讓觀眾意識到自己與物、空間、關聯性與都市秩序之間的距離。
    </p>
  </section>
