<main class="cms-login-page">
  <section class="cms-login-card">
    <h1>Content<br>Manager</h1>
    <p class="cms-subtitle">請登入後進入網站內容管理。登入後前台頁面會出現編輯功能。</p>

    <form id="loginForm">
      <div class="cms-form-row">
        <label for="username">帳號</label>
        <input id="username" type="text" placeholder="admin" autocomplete="username" required>
      </div>

      <div class="cms-form-row">
        <label for="password">密碼</label>
        <input id="password" type="password" placeholder="1234" autocomplete="current-password" required>
      </div>

      <div class="cms-actions">
        <button class="cms-btn" type="submit">管理</button>
        <a class="cms-btn secondary" href="index.html">回首頁</a>
      </div>
    </form>
  </section>
</main>
